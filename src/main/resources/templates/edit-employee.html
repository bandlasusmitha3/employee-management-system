<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee - BridgeSoft</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 70px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #111827;
        }

        .back {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel {
            background: #6c757d;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        .save {
            background: #007bff;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        .cancel:hover {
            background: #5a6268;
        }

        .save:hover {
            background: #0056b3;
        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        BridgeSoft
    </div>

    <a href="/employee-list" class="back">
        Employee List
    </a>

</nav>


<div class="container">

    <h1>Edit Employee</h1>


    <div class="form-box">

        <form id="editEmployeeForm">


            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    required>

            </div>


            <!-- Date of Joining -->

            <div class="form-group">

                <label for="doj">
                    Date of Joining
                </label>

                <input
                    type="date"
                    id="doj"
                    required>

            </div>


            <!-- Department -->

            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <input
                    type="text"
                    id="department"
                    required>

            </div>


            <!-- Designation -->

            <div class="form-group">

                <label for="designation">
                    Designation
                </label>

                <input
                    type="text"
                    id="designation"
                    required>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required>

            </div>


            <!-- Salary -->

            <div class="form-group">

                <label for="salary">
                    Salary
                </label>

                <input
                    type="number"
                    id="salary"
                    min="0"
                    required>

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <button
                    type="button"
                    class="cancel"
                    onclick="window.location.href='/employee-list'">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="save">

                    update

                </button>

            </div>


        </form>

    </div>

</div>


<script>


/* ==============================
   GET EMPLOYEE ID
   ============================== */

const params =
    new URLSearchParams(window.location.search);

const employeeId =
    params.get("id");


/* ==============================
   LOAD EMPLOYEE
   ============================== */

async function loadEmployee() {

    try {

        if (!employeeId) {

            alert("Employee ID is missing.");

            window.location.href = "/employee-list";

            return;

        }


        const response =
            await fetch("/employees/" + employeeId);


        if (!response.ok) {

            throw new Error(
                "Employee not found"
            );

        }


        const employee =
            await response.json();


        document.getElementById("name").value =
            employee.name || "";


        document.getElementById("doj").value =
            employee.doj || "";


        document.getElementById("department").value =
            employee.department || "";


        document.getElementById("designation").value =
            employee.designation || "";


        document.getElementById("email").value =
            employee.email || "";


        document.getElementById("salary").value =
            employee.salary || 0;


    } catch (error) {

        console.error(error);

        alert("Unable to load employee.");

    }

}



/* ==============================
   UPDATE EMPLOYEE
   ============================== */

document
    .getElementById("editEmployeeForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const employee = {

                name:
                    document.getElementById("name").value,

                doj:
                    document.getElementById("doj").value,

                department:
                    document.getElementById("department").value,

                designation:
                    document.getElementById("designation").value,

                email:
                    document.getElementById("email").value,

                salary:
                    Number(
                        document.getElementById("salary").value
                    )

            };


            try {

                const response =
                    await fetch(
                        "/employees/" + employeeId,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(employee)
                        }
                    );


                if (response.ok) {

                    alert(
                        "Employee updated successfully!"
                    );

                    window.location.href =
                        "/employee-list";

                } else {

                    const errorText =
                        await response.text();

                    console.error(errorText);

                    alert(
                        "Failed to update employee."
                    );

                }


            } catch (error) {

                console.error(error);

                alert(
                    "Something went wrong."
                );

            }

        }
    );


/* Start */

loadEmployee();

</script>


</body>

</html>
