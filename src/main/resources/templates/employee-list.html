<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee List - BridgeSoft</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
             min-height: 100vh;
            background: linear-gradient(180deg, #00d9e8 0%, #0b39ff 100%);
        }

        /* Navbar */

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 70px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #111827;
        }

        .add-btn {
                 display: inline-block;
                 background: #ffc107;
                 color: #111;
                 padding: 7px 12px;
                 border-radius: 5px 5px 0 0;
                 text-decoration: none;
                 font-weight: bold;
                 margin-bottom: 0;
}

        .add-btn:hover {
            background: #0056b3;
        }

        /* Main container */

        .container {
            width: 90%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        /* Search */

        .search-box {
            margin-bottom: 20px;
            text-align: center;
        }

        .search-box input {
            width: 60%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 4px rgba(0,123,255,0.3);
        }

        /* Table */

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        th:hover {
            background: #0056b3;
        }

        tr:hover {
            background: #f5f5f5;
        }

        /* Buttons */

        .edit-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-btn:hover {
            background: #218838;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        /* Empty message */

        .empty {
            text-align: center;
            padding: 30px;
            color: #666;
        }

    </style>

</head>


<body>


<!-- Navbar -->

<nav class="navbar">

    <div class="logo">
        BridgeSoft
    </div>

</nav>


<!-- Main content -->

<div class="container">

    <h1 id="pageTitle">Employee List</h1>
    
    <a href="/add-employee" class="add-btn">
        + Add Employee
    </a>


    <!-- Employee table -->

    <table>

        <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Date of Joining</th>
                <th>Department</th>
                <th>Designation</th>
                <th>Email</th>
                <th>Salary</th>
                <th>Action</th>
            </tr>

        </thead>


        <tbody id="employeeTableBody">

        </tbody>

    </table>

</div>


<script>


/* ==============================
   EMPLOYEE DATA
   ============================== */

let employeesData = [];

let sortField = "";

let sortDirection = 1;



/* ==============================
   LOAD ALL EMPLOYEES
   ============================== */

async function loadEmployees() {

    try {

        const response = await fetch("/employees");

        if (!response.ok) {

            throw new Error("Failed to load employees");

        }

        const employees = await response.json();

        employeesData = employees;

        displayEmployees(employeesData);

    } catch (error) {

        console.error("Error loading employees:", error);

        alert("Unable to load employees.");

    }

}



/* ==============================
   DISPLAY EMPLOYEES
   ============================== */

function displayEmployees(employees) {

    const tableBody =
        document.getElementById("employeeTableBody");

    tableBody.innerHTML = "";


    /* No employees */

    if (employees.length === 0) {

        tableBody.innerHTML =
            '<tr><td colspan="8" class="empty">No employees found</td></tr>';

        return;

    }


    /* Display employees */

    employees.forEach(employee => {

        const row = document.createElement("tr");

        row.innerHTML = `

            <td>${employee.id}</td>

            <td>${employee.name || ""}</td>

            <td>${employee.doj || ""}</td>

            <td>${employee.department || ""}</td>

            <td>${employee.designation || ""}</td>

            <td>${employee.email || ""}</td>

            <td>₹${employee.salary || 0}</td>

            <td>

                <button
                    class="edit-btn"
                    onclick="editEmployee(${employee.id})">
                    update
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteEmployee(${employee.id})">
                    Delete
                </button>

            </td>

        `;

        tableBody.appendChild(row);

    });

}



/* ==============================
   SORT EMPLOYEES
   ============================== */

function sortEmployees(field) {

    if (sortField === field) {

        sortDirection *= -1;

    } else {

        sortField = field;

        sortDirection = 1;

    }


    employeesData.sort((a, b) => {

        let valueA = a[field];

        let valueB = b[field];


        /* Numbers */

        if (field === "id" || field === "salary") {

            valueA = Number(valueA) || 0;

            valueB = Number(valueB) || 0;

            return (valueA - valueB) * sortDirection;

        }


        /* Text */

        valueA = String(valueA || "").toLowerCase();

        valueB = String(valueB || "").toLowerCase();


        return valueA.localeCompare(valueB) * sortDirection;

    });


    displayEmployees(employeesData);

}



/* ==============================
   EDIT EMPLOYEE
   ============================== */

function editEmployee(id) {

    window.location.href =
        "/edit-employee?id=" + id;

}



/* ==============================
   DELETE EMPLOYEE
   ============================== */

async function deleteEmployee(id) {

    if (!confirm(
        "Are you sure you want to delete this employee?"
    )) {

        return;

    }


    try {

        const response = await fetch(
            "/employees/" + id,
            {
                method: "DELETE"
            }
        );


        if (response.ok) {

            alert(
                "Employee deleted successfully!"
            );

            loadEmployees();

        } else {

            alert(
                "Failed to delete employee."
            );

        }


    } catch (error) {

        console.error(error);

        alert(
            "Something went wrong."
        );

    }

}



/* ==============================
   SEARCH EMPLOYEES
   ============================== */

function searchEmployees() {

    const searchText =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const filteredEmployees =
        employeesData.filter(employee => {

            const name =
                String(employee.name || "").toLowerCase();

            const department =
                String(employee.department || "").toLowerCase();

            const designation =
                String(employee.designation || "").toLowerCase();


            return (
                name.includes(searchText) ||
                department.includes(searchText) ||
                designation.includes(searchText)
            );

        });


    displayEmployees(filteredEmployees);

}



/* ==============================
   START APPLICATION
   ============================== */

/* ==============================
   TYPEWRITER PAGE TITLE
   ============================== */

const pageTitles = [
    "Employee List",
    "Employee Details",
    "Employee Information"
];

let titleIndex = 0;
let characterIndex = 0;
let deleting = false;

const pageTitle = document.getElementById("pageTitle");

function typeWriter() {

    const currentTitle = pageTitles[titleIndex];

    if (!deleting) {

        pageTitle.textContent =
            currentTitle.substring(0, characterIndex + 1);

        characterIndex++;

        if (characterIndex === currentTitle.length) {

            setTimeout(() => {
                deleting = true;
            }, 1500);

        }

    } else {

        pageTitle.textContent =
            currentTitle.substring(0, characterIndex - 1);

        characterIndex--;

        if (characterIndex === 0) {

            deleting = false;

            titleIndex =
                (titleIndex + 1) % pageTitles.length;

        }

    }

    setTimeout(typeWriter, deleting ? 80 : 120);
}

typeWriter();


loadEmployees();

</script>


</body>

</html>
