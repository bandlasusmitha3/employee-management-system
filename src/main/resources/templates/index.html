<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
        }

        /* NAVBAR */
        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 70px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #111827;
        }

        .logout {
            text-decoration: none;
            color: #2563eb;
            font-size: 16px;
            font-weight: 600;
        }

        /* MAIN */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 55px auto;
        }

        .title-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .title-section h1 {
            color: white;
            font-size: 32px;
        }

        .add-btn {
            background: #ffc107;
            color: #111;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 5px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #e0a800;
        }

        /* TABLE */
        .table-container {
            background: white;
            padding: 25px;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            color: #212529;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            color: #333;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .update-btn {
            background: #007bff;
            color: white;
            padding: 7px 14px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #0056b3;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 7px 14px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            margin-left: 5px;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        /* FOOTER */
        footer {
            text-align: center;
            color: white;
            padding: 30px 0;
            margin-top: 70px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0 20px;
            }

            .container {
                width: 95%;
            }

            .title-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .title-section h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        BridgeSoft
    </div>

    <a href="#" class="logout">
        Logout
    </a>

</nav>

<div class="container">

    <div class="title-section">

        <h1>Employee Information</h1>

        <button class="add-btn" onclick="addEmployee()">
            Add Employee
        </button>

    </div>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>DOJ</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="employeeTable">
            </tbody>

        </table>

    </div>

</div>

<footer>
    © All Right Reserved - 2026
</footer>


<script>

    const API_URL = "/employees";

    async function loadEmployees() {

        try {

            const response = await fetch(API_URL);

            const employees = await response.json();

            const table = document.getElementById("employeeTable");

            table.innerHTML = "";

            employees.forEach(employee => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${employee.id}</td>
                    <td>${employee.name}</td>
                    <td>${employee.doj || "-"}</td>
                    <td>${employee.department || "-"}</td>
                    <td>${employee.designation || "-"}</td>

                    <td>
                        <button class="update-btn"
                            onclick="updateEmployee(${employee.id})">
                            Update
                        </button>

                        <button class="delete-btn"
                            onclick="deleteEmployee(${employee.id})">
                            Delete
                        </button>
                    </td>
                `;

                table.appendChild(row);

            });

        } catch (error) {

            console.error("Error loading employees:", error);

        }

    }


    function addEmployee() {

        window.location.href = "/add-employee";

    }


    function updateEmployee(id) {

        window.location.href = "/update-employee/" + id;

    }


    async function deleteEmployee(id) {

        if (!confirm("Are you sure you want to delete this employee?")) {
            return;
        }

        try {

            const response = await fetch(API_URL + "/" + id, {
                method: "DELETE"
            });

            if (response.ok) {

                alert("Employee deleted successfully!");

                loadEmployees();

            } else {

                alert("Unable to delete employee.");

            }

        } catch (error) {

            console.error(error);

            alert("Something went wrong.");

        }

    }


    loadEmployees();

</script>

</body>
</html>
